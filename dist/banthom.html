@media (max-width: 1023px) { .engine-board { grid-template-columns: 1fr; } }

.split-60 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 56px; align-items: center; }
.split-60.is-reversed > .split-text { order: 2; }
.split-text { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; min-width: 0; }
.split-text .sec-head { margin-bottom: 0; }
@media (max-width: 1023px) {
  .split-60 { grid-template-columns: 1fr; gap: 32px; }
  .split-60.is-reversed > .split-text { order: 0; }
}
.venue-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
.venue-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 0; }
.venue-card .pv-watermark { margin-left: 0; }
.venue-card-title { color: var(--text); font-size: 14px; line-height: 20px; font-weight: 500; }
.venue-quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.venue-quotes > div { display: flex; flex-direction: column; gap: 2px; padding: 10px; background: var(--canvas); border: 1px solid var(--border); border-radius: var(--r-sm); }
.venue-card-foot { color: var(--text-3); font-size: 12px; line-height: 18px; margin-top: auto; }
.pair-link { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; max-width: 132px; text-align: center; }
.pair-line { width: 1px; flex: 1 1 16px; background: var(--border-strong); }
.term-diff { margin-top: 12px; padding: 4px 16px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.term-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 13px; line-height: 20px; }
.term-k { color: var(--text-3); }
.term-v { color: var(--text-2); }
.term-row.is-diff .term-v { color: var(--text); }
.term-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text-2); font-size: 13px; line-height: 20px; }
.term-foot .icon { color: var(--warning); flex: none; }
@media (max-width: 767px) {
  .venue-pair { grid-template-columns: 1fr; }
  .pair-link { flex-direction: row; max-width: none; }
  .pair-line { height: 1px; width: auto; flex: 1 1 16px; }
  .term-row { grid-template-columns: 1fr auto; }
  .term-row .term-v { grid-column: 1 / -1; grid-row: 2; }
}

.sec-research { background: linear-gradient(180deg, var(--canvas), var(--sidebar)); border-top: 1px solid var(--border); }
.ra-visual > div { display: flex; flex-direction: column; gap: 12px; }
.ra-question { align-self: flex-end; max-width: 88%; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px 14px 4px 14px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text); font-size: 15px; line-height: 22px; }
.ra-avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--hover); color: var(--text-2); }
.ra-answer { display: flex; flex-direction: column; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.ra-points { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.ra-points li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--text-2); font-size: 14px; line-height: 22px; }
.ra-points li > span:not(.badge):not(.src-pill) { flex: 1 1 260px; min-width: 0; }
.ra-foot { color: var(--text-3); font-size: 12px; line-height: 16px; }

.plan-teaser { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 900px; }
.plan-card { display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 0; }
.plan-card.is-featured { border-color: var(--accent-line); background: linear-gradient(180deg, rgba(70, 200, 229, 0.05), transparent 40%), var(--surface); }
.plan-head { display: flex; flex-direction: column; gap: 2px; }
.plan-name { font-size: 20px; line-height: 28px; }
.plan-price { display: flex; align-items: baseline; gap: 6px; }
.plan-price .mono { color: var(--text); font-size: 40px; line-height: 44px; font-weight: 600; }
.plan-feats { list-style: none; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; }
.plan-feats li { display: flex; gap: 10px; align-items: flex-start; color: var(--text-2); font-size: 14px; line-height: 22px; }
.plan-feats .icon { color: var(--accent); margin-top: 3px; }
.plan-note { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--text-3); font-size: 14px; line-height: 22px; flex-wrap: wrap; }
@media (max-width: 767px) { .plan-teaser { grid-template-columns: 1fr; } }

.faq-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 56px; align-items: start; }
.faq { border-top: 1px solid var(--border); }
.faq-item { border-bottom: 1px solid var(--border); }
.faq-item summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; cursor: pointer; color: var(--text); font-size: 16px; line-height: 24px; font-weight: 500; border-radius: var(--r-xs); }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary .icon { color: var(--text-3); transition: transform var(--t-med) var(--ease); flex: none; }
.faq-item[open] summary .icon { transform: rotate(45deg); color: var(--accent); }
.faq-item p { padding: 0 40px 20px 0; color: var(--text-2); font-size: 15px; line-height: 24px; max-width: 65ch; }
@media (max-width: 1023px) { .faq-grid { grid-template-columns: 1fr; gap: 8px; } }

.closing { padding-block: 96px; border-top: 1px solid var(--border); background: radial-gradient(ellipse 60% 90% at 50% 110%, rgba(70, 200, 229, 0.12), transparent 70%); }
.closing-inner { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px; }
.closing-inner .mkt-h2 { max-width: 18em; }
@media (max-width: 767px) { .closing { padding-block: 64px; } }

/* ---------------------------------------------------------------- Footer */
.mkt-footer { border-top: 1px solid var(--border); background: var(--sidebar); padding-block: 56px 32px; }
.footer-top { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 3fr); gap: 48px; }
.footer-brand p { margin-top: 14px; color: var(--text-3); font-size: 14px; line-height: 22px; max-width: 34ch; }
.footer-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.footer-title { color: var(--text); font-size: 13px; line-height: 20px; margin-bottom: 12px; }
.footer-cols ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.footer-cols a { color: var(--text-3); text-decoration: none; font-size: 14px; line-height: 20px; }
.footer-cols a:hover { color: var(--text); }
.footer-bottom { display: flex; flex-direction: column; gap: 16px; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border); }
.footer-disclaimer { color: var(--text-3); font-size: 13px; line-height: 20px; max-width: 92ch; }
.footer-legal { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--text-3); font-size: 13px; line-height: 20px; }
.footer-legal a { color: var(--text-3); }
.footer-legal a:hover { color: var(--text); }
@media (max-width: 1023px) { .footer-top { grid-template-columns: 1fr; gap: 32px; } }
@media (max-width: 639px) { .footer-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; } }

/* ---------------------------------------------------------------- Public inner pages */
.page-hero { position: relative; padding-block: 72px 56px; background: radial-gradient(ellipse 50% 80% at 85% 0%, rgba(70, 200, 229, 0.08), transparent 70%); }
.page-hero-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.page-hero-h1 { max-width: 16em; }
.page-hero .hero-sub { margin-top: 0; max-width: 40em; }
.page-hero .row { margin-top: 8px; }
.pt-0 { padding-top: 0; }
.sec-gap { margin-top: 64px; margin-bottom: 20px; }
@media (max-width: 767px) { .page-hero { padding-block: 40px 32px; } .sec-gap { margin-top: 44px; } }

.pricing-toggle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.placeholder-note { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 12px; border-radius: var(--r-md); border: 1px dashed var(--warning-line); color: var(--text-2); font-size: 14px; line-height: 20px; }
.placeholder-note .icon { color: var(--warning); flex: none; }
.plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.plan-custom { color: var(--text); font-size: 32px; line-height: 44px; font-weight: 600; }
@media (max-width: 1199px) { .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 639px) { .plans { grid-template-columns: 1fr; } }
.compare-plans { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.compare-plans:focus-visible { outline-offset: 2px; }
.plan-table { min-width: 760px; }
.plan-table th, .plan-table td { height: 46px; font-size: 14px; }
.plan-table thead th { color: var(--text); font-size: 14px; font-weight: 600; height: 52px; }
.plan-table tbody th { color: var(--text-2); font-weight: 400; text-align: left; border-bottom: 1px solid var(--grid); background: var(--surface); }
.plan-table td { color: var(--text-2); }
.plan-table .plan-group th { color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; height: 40px; padding-top: 12px; background: var(--surface); }
.sticky-col { position: sticky; left: 0; z-index: 1; }
.plan-table .sticky-col { min-width: 260px; }
.info-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 64px; }
.info-cols h2 { margin-bottom: 8px; }
.info-cols p { color: var(--text-2); font-size: 15px; line-height: 24px; }
@media (max-width: 1023px) { .info-cols { grid-template-columns: 1fr; gap: 24px; } }

/* Methodology */
.method { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 56px; align-items: start; }
.method-toc { position: sticky; top: calc(var(--mkt-nav) + 24px + env(safe-area-inset-top, 0px)); }
.method-toc ul { list-style: none; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--border); }
.method-toc a { display: block; padding: 6px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--text-3); text-decoration: none; font-size: 13px; line-height: 20px; }
.method-toc a:hover { color: var(--text); }
.method-toc a[aria-current] { color: var(--text); border-left-color: var(--accent); }
.method-toc-title { margin-bottom: 10px; }
.method-select { display: none; }
@media (max-width: 1023px) {
  .method { grid-template-columns: 1fr; gap: 24px; }
  .method-toc { position: sticky; top: calc(var(--mkt-nav) + 8px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--canvas); padding-block: 8px; }
  .method-toc ul, .method-toc-title { display: none; }
  .method-select { display: block; }
}
.prose { max-width: 760px; min-width: 0; }
.prose section { padding-top: 40px; scroll-margin-top: calc(var(--mkt-nav) + 24px); }
.prose section:focus { outline: none; }
.prose h2 { font-size: 24px; line-height: 32px; margin-bottom: 12px; }
.prose p { color: var(--text-2); font-size: 15px; line-height: 26px; margin-bottom: 14px; max-width: 70ch; }
.prose strong { color: var(--text); font-weight: 600; }
.prose .table-scroll { margin: 8px 0 16px; border: 1px solid var(--border); border-radius: var(--r-md); }
.prose .table-caption { padding: 10px 12px 0; }
.callout { display: flex; gap: 12px; padding: 16px; border-radius: var(--r-md); border: 1px solid var(--warning-line); background: var(--warning-bg); color: var(--text); }
.callout > .icon { color: var(--warning); margin-top: 2px; }
.callout ul { margin-top: 8px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--text-2); font-size: 15px; line-height: 24px; }
.entity-chain { list-style: none; display: flex; flex-direction: column; margin: 8px 0 16px; border-left: 1px solid var(--border-strong); }
.entity-chain li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px 0 10px 16px; position: relative; font-size: 15px; line-height: 24px; color: var(--text-2); }
.entity-chain li::before { content: ""; position: absolute; left: -4px; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.entity-k { color: var(--text); font-weight: 600; }
.defs { display: flex; flex-direction: column; margin: 0 0 12px; border-top: 1px solid var(--border); }
.defs > div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.defs dt { color: var(--text); font-weight: 600; font-size: 15px; line-height: 24px; }
.defs dd { margin: 0; color: var(--text-2); font-size: 15px; line-height: 24px; }
.formula { display: block; margin-top: 8px; width: fit-content; max-width: 100%; overflow-x: auto; padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; white-space: nowrap; }
.formula-block { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); }
.formula-block code { color: var(--text); font-size: 13px; overflow-x: auto; white-space: nowrap; }
.formula-block span { color: var(--text-3); font-size: 14px; line-height: 22px; }
.status-legend { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 8px 0 16px; }
.status-legend li { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: start; color: var(--text-2); font-size: 15px; line-height: 24px; }
.status-legend .badge { justify-self: start; margin-top: 1px; }
.changelog { list-style: none; }
.changelog li { display: grid; grid-template-columns: 56px 120px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); color: var(--text-2); font-size: 14px; }
@media (max-width: 767px) {
  .defs > div, .status-legend li { grid-template-columns: 1fr; gap: 6px; }
  .entity-chain li { grid-template-columns: 1fr; gap: 2px; }
  .changelog li { grid-template-columns: 48px minmax(0, 1fr); }
  .changelog li span:last-child { grid-column: 1 / -1; }
}

/* Auth */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); }
.auth-brand { display: none; }
@media (min-width: 1024px) {
  .auth { grid-template-columns: minmax(380px, 0.9fr) minmax(0, 1.1fr); }
  .auth-brand { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px 48px max(48px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--border); background: radial-gradient(ellipse 80% 60% at 20% 30%, rgba(70, 200, 229, 0.10), transparent 70%), var(--sidebar); overflow: hidden; }
  .auth-top .logo { visibility: hidden; }
}
.auth-brand-body { display: flex; flex-direction: column; gap: 28px; position: relative; z-index: 1; }
.auth-quote { color: var(--text); font-size: 34px; line-height: 42px; font-weight: 600; letter-spacing: -0.015em; max-width: 12em; }
.auth-points { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.auth-points li { display: flex; gap: 12px; align-items: center; color: var(--text-2); font-size: 15px; }
.auth-points .icon { color: var(--accent); }
.auth-line { position: absolute; left: 0; right: 0; top: 34%; width: 100%; height: 120px; opacity: 0.45; }
.auth-main { display: flex; flex-direction: column; align-items: center; padding: 24px var(--gutter-r) 48px var(--gutter-l); }
.auth-top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.muted-link { color: var(--text-3); }
.auth-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; margin-block: auto; padding: 28px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); }
.auth-title { font-size: 24px; line-height: 32px; }
.auth-title:focus { outline: none; }
.auth-form { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
.auth-or { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; }
.auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.pw-input { padding-right: 64px; }
.pw-toggle { position: absolute; right: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; }
.pw-toggle:hover { background: var(--elevated); }
.pw-rules { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: -8px; }
.pw-rules li { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
.pw-rules li.is-ok { color: var(--success); }
.auth-consents { gap: 10px; }
.auth-terms-err { margin: 4px 0 0 28px; }
.auth-switch { text-align: center; color: var(--text-3); font-size: 14px; }
.auth-sent { margin-top: 18px; }
.auth-demo { display: flex; gap: 6px; align-items: flex-start; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; line-height: 18px; }
.auth-demo .icon { margin-top: 2px; flex: none; }
@media (max-width: 479px) { .auth-card { padding: 20px 16px; } }

/* Onboarding */
.onb { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(70, 200, 229, 0.07), transparent 70%), var(--canvas); }
.onb-top { display: flex; justify-content: space-between; align-items: center; padding: 20px var(--gutter-r) 20px var(--gutter-l); }
.onb-main { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px var(--gutter-r) 64px var(--gutter-l); display: flex; flex-direction: column; gap: 16px; }
.onb-steps { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.onb-steps li { padding-top: 10px; border-top: 3px solid var(--border); color: var(--text-3); font-size: 13px; line-height: 18px; }
.onb-steps li.is-done { border-top-color: var(--accent-line); color: var(--text-2); }
.onb-steps li.is-current { border-top-color: var(--accent); color: var(--text); font-weight: 500; }
.onb-title { font-size: 32px; line-height: 40px; margin-top: 12px; letter-spacing: -0.01em; }
.onb-title:focus { outline: none; }
.onb-legend { color: var(--text); font-size: 16px !important; font-weight: 600 !important; margin-bottom: 12px !important; }
.choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; text-align: left; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); }
.choice:hover { border-color: var(--border-control); background: var(--elevated); }
.choice .icon { color: var(--text-3); }
.choice.is-on { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.is-on .icon { color: var(--accent); }
.choice-sm { flex-direction: row; align-items: center; padding: 12px 14px; }
.choice-label { color: var(--text); font-size: 15px; font-weight: 600; }
.choice-desc { color: var(--text-3); font-size: 13px; line-height: 20px; }
.chip-btn { cursor: pointer; }
.chip-btn:hover { border-color: var(--border-control); color: var(--text); }
.onb-panel { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.onb-panel .switch-row + .switch-row { border-top: 1px solid var(--grid); }
.onb-note { display: flex; gap: 6px; align-items: flex-start; padding: 10px 0 12px; border-top: 1px solid var(--grid); }
.onb-note .icon { margin-top: 3px; flex: none; }
.onb-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.onb-hint { text-align: right; }
@media (max-width: 639px) { .choice-grid { grid-template-columns: 1fr; } .onb-title { font-size: 26px; line-height: 34px; } }

/* Stub pages */
.stub { min-height: 60vh; }
.stub-card { width: 100%; max-width: 720px; margin-top: 12px; padding: 20px; border-radius: var(--r-lg); border: 1px dashed var(--border-strong); background: var(--surface); }
.stub-flag { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--text); font-size: 14px; font-weight: 500; }
.stub-flag .icon { color: var(--accent); }
.stub-list { margin-top: 8px; padding-left: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; color: var(--text-2); font-size: 14px; line-height: 22px; }
@media (max-width: 639px) { .stub-list { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------- Terminal shell */
.term { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; background: var(--canvas); }
.term-expanded { grid-template-columns: var(--rail) minmax(0, 1fr); }
.term-rail { grid-template-columns: var(--rail-collapsed) minmax(0, 1fr); }
.term-col { min-width: 0; display: flex; flex-direction: column; }
.term-main { flex: 1 0 auto; min-width: 0; padding: 20px 24px 32px; }
.term-drawer .term-main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.term-mobile .term-main { padding: 16px var(--gutter-r) calc(88px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.term-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 12px 24px 16px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; line-height: 18px; }
.term-foot a { color: var(--text-3); }
.term-mobile .term-foot { padding: 12px var(--gutter-r) calc(84px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.term-mobile .term-main { padding-bottom: 24px; }

/* Sidebar */
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; overflow-x: hidden; background: var(--sidebar);
  border-right: 1px solid var(--border); padding-left: env(safe-area-inset-left, 0px); scrollbar-width: thin;
}
.side-inner { display: flex; flex-direction: column; gap: 6px; min-height: 100%; padding: 14px 12px 12px; }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; margin-bottom: 8px; padding-left: 4px; }
.side-search {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; margin-bottom: 8px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--canvas); color: var(--text-3); font-size: 13px; text-align: left;
}
.side-search:hover { border-color: var(--border-control); color: var(--text-2); }
.side-kbd { margin-left: auto; }
.side-nav { display: flex; flex-direction: column; gap: 10px; }
.side-nav ul, .side-foot ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.side-link {
  position: relative; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: var(--r-sm);
  color: var(--text-2); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.side-link:hover { color: var(--text); background: var(--elevated); }
.side-link.is-active { color: var(--text); background: rgba(70, 200, 229, 0.08); }
.side-link.is-active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.side-link.is-active .icon { color: var(--accent); }
.side-label { overflow: hidden; text-overflow: ellipsis; }
.side-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 600 11px/18px var(--font-mono); text-align: center; }
.side-group { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--border); }
.side-group-btn { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 10px; border: 0; background: transparent; color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: var(--r-xs); }
.side-group-btn:hover { color: var(--text); }
.side-group-btn[aria-expanded="false"] .icon { transform: rotate(-90deg); }
.side-sep { height: 1px; }
.side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.side-profile { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); }
.side-profile-text { display: flex; flex-direction: column; line-height: 18px; min-width: 0; }
.avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-subtle); color: var(--accent); font: 600 11px/1 var(--font-mono); border: 1px solid var(--accent-line); }
.side-inner.is-collapsed { padding: 14px 10px 12px; align-items: stretch; }
.is-collapsed .side-top { justify-content: center; padding-left: 0; }
.is-collapsed .side-label, .is-collapsed .side-group-btn { display: none; }
.is-collapsed .side-search { justify-content: center; padding: 0; }
.is-collapsed .side-link { justify-content: center; padding: 0; }
.is-collapsed .side-link.is-active::before { left: -10px; }
.is-collapsed .side-badge { position: absolute; top: 2px; right: 4px; min-width: 16px; height: 16px; font-size: 10px; line-height: 16px; padding: 0 4px; }
.is-collapsed .side-profile { justify-content: center; padding: 6px 0; }
.side-expand { align-self: center; }
.nav-sheet .sheet-body { padding: 0; }
.nav-sheet .sheet-head { display: none; }
.nav-sheet .side-inner { min-height: 100%; }

/* Demo banner */
.demo-banner {
  display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 24px; background: #11171e;
  border-bottom: 1px solid var(--warning-line); font-size: 13px; line-height: 18px; color: var(--text-2);
}
.term-drawer .demo-banner, .term-mobile .demo-banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-text { flex: 1 1 auto; min-width: 0; }
.demo-short { display: none; }
.demo-controls { display: flex; align-items: center; gap: 6px; flex: none; }
.demo-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--r-xs); border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.demo-btn:hover, .demo-btn[aria-expanded="true"] { background: var(--elevated); color: var(--text); }
.demo-btn[aria-pressed="true"] { border-color: var(--warning-line); color: var(--warning); }
.scenario-pop { width: 300px; }
.scenario-list { display: flex; flex-direction: column; margin-top: 8px; }
.scenario-opt { display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); text-align: left; font-size: 14px; }
.scenario-opt:hover { background: var(--hover); color: var(--text); }
.scenario-opt[aria-checked="true"] { color: var(--text); }
.radio-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-control); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.scenario-opt[aria-checked="true"] .radio-dot { border-color: var(--accent); }
.scenario-opt[aria-checked="true"] .radio-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.scenario-sep { height: 1px; background: var(--border); margin: 8px 0 0; }
@media (max-width: 1023px) {
  .demo-long { display: none; }
  .demo-short { display: inline; }
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 12px; height: var(--topbar);
  padding: 0 24px; background: var(--canvas); border-bottom: 1px solid var(--border);
}
.term-drawer .topbar, .term-mobile .topbar { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px; }
.topbar-logo { display: inline-flex; border-radius: var(--r-sm); }
.topbar-crumbs { flex: 1 1 auto; min-width: 0; }
.topbar-crumbs .crumbs ol { flex-wrap: nowrap; overflow: hidden; }
.topbar-crumbs .crumbs li { flex: none; }
.topbar-crumbs .crumbs li:last-child { flex: 0 1 auto; min-width: 0; }
.topbar-crumbs .crumbs li:last-child span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-crumbs .crumbs [aria-current] { color: var(--text); font-weight: 500; }
.topbar-search {
  display: flex; align-items: center; gap: 10px; width: 300px; height: 36px; padding: 0 8px 0 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-3); font-size: 13px; flex: none;
}
.topbar-search:hover { border-color: var(--border-control); color: var(--text-2); }
.topbar-search-text { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 6px; flex: none; }
.plan-badge { display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: var(--r-xs); border: 1px solid var(--warning-line); color: var(--warning); font-size: 12px; font-weight: 600; white-space: nowrap; }
.feed-pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.feed-pill:hover, .feed-pill[aria-expanded="true"] { background: var(--elevated); color: var(--text); }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }
.feed-pill.is-warn { border-color: var(--warning-line); color: var(--warning); }
.feed-pill.is-warn .feed-dot { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-bg); }
.feed-time { color: var(--text-3); font-size: 12px; }
.feed-pop { display: flex; flex-direction: column; gap: 8px; }
.feed-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 4px 0; }
.feed-list li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }

.preview-box { padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--accent-line); background: var(--accent-bg); color: var(--text); font-size: 14px; line-height: 22px; display: flex; flex-direction: column; gap: 4px; }
