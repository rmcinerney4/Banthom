<title>Banthom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout concept: one graphite system for both surfaces. Marketing runs on a 1200px, 12-column grid with
   generous section rhythm; the terminal is a 232/68px rail + 60px top bar + 12-column panel grid.
   Tokens come from the Signal Terminal handoff (design-tokens.json + DESIGN_SPEC §3). The look is
   deliberately dark-only: the spec makes dark the default and light terminal a phase-2 option. */
:root {
  color-scheme: dark;
  /* Surfaces */
  --canvas: #0B1016;
  --sidebar: #0E151D;
  --surface: #141D27;
  --elevated: #1B2733;
  --hover: #233242;
  --border: #293744;
  --border-strong: #425365;
  --border-control: #5E7286; /* form-control outline: 3.4:1 on surface (WCAG 1.4.11) */
  /* Text */
  --text: #F2F6FA;
  --text-2: #B1C0CF;
  --text-3: #90A2B5;
  /* Accent and semantics */
  --accent: #46C8E5;
  --accent-hover: #79DDF2;
  --accent-subtle: #123847;
  --on-accent: #061218;
  --success: #4AD7A0;
  --danger: #FF858B;
  --warning: #F7C66A;
  --info: #91B9FF;
  --accent-bg: rgba(70, 200, 229, 0.10);
  --success-bg: rgba(74, 215, 160, 0.10);
  --danger-bg: rgba(255, 133, 139, 0.10);
  --warning-bg: rgba(247, 198, 106, 0.10);
  --info-bg: rgba(145, 185, 255, 0.10);
  --success-line: rgba(74, 215, 160, 0.32);
  --danger-line: rgba(255, 133, 139, 0.32);
  --warning-line: rgba(247, 198, 106, 0.36);
  --info-line: rgba(145, 185, 255, 0.32);
  --accent-line: rgba(70, 200, 229, 0.36);
  /* Data visualisation (chart-2 shifted from #B39AF7 so the pair passes a deuteranopia check, with dashes as backup) */
  --chart-1: #5AC7EB;
  --chart-2: #C58AF9;
  --chart-3: #F9C56D;
  --chart-surface: #141D27;
  --grid: #1F2B38;
  --spark: #6F8296;
  --tick-flash: rgba(70, 200, 229, 0.22);
  /* Type */
  --font-sans: "IBM Plex Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Shape, depth, motion */
  --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-pill: 9999px;
  --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.32);
  --shadow-menu: 0 8px 24px rgba(0, 0, 0, 0.28);
  --t-fast: 120ms; --t-med: 180ms; --t-slow: 240ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* Layout */
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --rail: 232px;
  --rail-collapsed: 68px;
  --topbar: 60px;
  --mkt-nav: 72px;
  --row: 40px;
}
[data-density="compact"] { --row: 32px; }
[data-density="comfortable"] { --row: 48px; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--text-2);
  font: 400 14px/22px var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--canvas);
}
#root { min-height: 100%; }
.boot { padding: 48px var(--gutter-r) 48px var(--gutter-l); color: var(--text-3); font-family: var(--font-sans); }
h1, h2, h3, h4 { color: var(--text); margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent-hover); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; }
.icon { flex: none; }
ul, ol { margin: 0; padding: 0; }
table { border-collapse: collapse; }
kbd, code, pre { font-family: var(--font-mono); }
::selection { background: var(--accent-subtle); color: var(--text); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; left: var(--gutter-l); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 200;
  background: var(--accent); color: var(--on-accent); padding: 8px 14px; border-radius: var(--r-sm);
  font-weight: 600; transform: translateY(-160%); transition: transform var(--t-fast) var(--ease); text-decoration: none;
}
.skip-link:focus { transform: none; color: var(--on-accent); }

.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.small { font-size: 13px; line-height: 20px; }
.micro { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; }
.label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-3); }
.eyebrow {
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
}
.strong { color: var(--text); font-weight: 600; }
.up { color: var(--success); }
.down { color: var(--danger); }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

@media (max-width: 767px) {
  body { font-size: 15px; line-height: 24px; }
  .micro { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ---------------------------------------------------------------- Buttons */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--text);
  font-weight: 600; white-space: nowrap; text-decoration: none; user-select: none;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.btn:hover { text-decoration: none; }
.btn-xs { height: 28px; padding: 0 10px; font-size: 12px; line-height: 16px; gap: 6px; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; line-height: 18px; gap: 6px; }
.btn-md { height: 40px; padding: 0 16px; font-size: 14px; line-height: 20px; }
.btn-lg { height: 48px; padding: 0 20px; font-size: 15px; line-height: 20px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); color: var(--on-accent); }
.btn-primary:active { background: #3BB6D2; }
.btn-secondary { background: var(--elevated); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover { background: var(--hover); color: var(--text); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--elevated); color: var(--text); }
.btn-ghost[aria-pressed="true"], .btn-ghost[aria-expanded="true"] { background: var(--elevated); color: var(--text); }
.btn-destructive { border-color: var(--danger-line); color: var(--danger); }
.btn-destructive:hover { background: var(--danger-bg); color: var(--danger); }
.btn-link { height: auto; padding: 0; color: var(--accent); font-weight: 600; }
.btn-link:hover { color: var(--accent-hover); text-decoration: underline; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.btn-icon { padding: 0; }
.btn-icon.btn-xs { width: 28px; } .btn-icon.btn-sm { width: 32px; } .btn-icon.btn-md { width: 40px; } .btn-icon.btn-lg { width: 48px; }
.btn-badge {
  position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font: 600 10px/16px var(--font-mono); text-align: center;
}
.btn .btn-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (pointer: coarse) {
  .btn-xs::after, .btn-sm::after, .btn-icon::after { content: ""; position: absolute; inset: -6px; }
}

/* ---------------------------------------------------------------- Tooltips (hover and keyboard focus) */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translate(-50%, 2px);
  width: max-content; max-width: 260px; padding: 6px 9px; border-radius: var(--r-sm);
  background: var(--elevated); border: 1px solid var(--border-strong); box-shadow: var(--shadow-menu);
  color: var(--text); font: 500 12px/16px var(--font-sans); letter-spacing: 0; text-transform: none; text-align: left; white-space: normal;
  pointer-events: none; z-index: 90; display: none;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { display: block; animation: tip-in var(--t-fast) var(--ease) 0.35s both; transform: translate(-50%, 0); }
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
[data-tip-pos="bottom"]::after { bottom: auto; top: calc(100% + 8px); }
[data-tip-pos="right"]::after { left: calc(100% + 10px); bottom: auto; top: 50%; transform: translate(0, -50%); }
[data-tip-pos="right"]:hover::after, [data-tip-pos="right"]:focus-visible::after { transform: translate(0, -50%); }
[data-tip-pos="left"]::after { left: auto; right: calc(100% + 10px); bottom: auto; top: 50%; transform: translate(0, -50%); }
[data-tip-pos="left"]:hover::after, [data-tip-pos="left"]:focus-visible::after { transform: translate(0, -50%); }
@media (hover: none) { [data-tip]:hover::after { display: none; } }
.info-tip {
  display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0;
  border: 0; background: transparent; color: var(--text-3); border-radius: 50%; vertical-align: middle; margin-left: 2px;
}
.info-tip:hover { color: var(--text); }

/* ---------------------------------------------------------------- Badges, tags, deltas */
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); color: var(--text-2); font-size: 12px; line-height: 16px; font-weight: 500;
  white-space: nowrap; vertical-align: middle; max-width: 100%;
}
.badge > span { overflow: hidden; text-overflow: ellipsis; }
.badge-sm { height: 20px; padding: 0 6px; font-size: 11px; }
.badge-neutral { background: transparent; }
.badge-muted { border-color: var(--border); color: var(--text-3); }
.badge-success { background: var(--success-bg); border-color: var(--success-line); color: var(--success); }
.badge-warning { background: var(--warning-bg); border-color: var(--warning-line); color: var(--warning); }
.badge-danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
.badge-info { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }
.badge-accent { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent); }
.venue {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; border-radius: var(--r-xs);
  border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-2);
  font: 600 11px/16px var(--font-mono); letter-spacing: 0.04em; white-space: nowrap;
}
.venue-brs { border-style: dashed; }
.venue-name { font-family: var(--font-sans); font-weight: 500; letter-spacing: 0; font-size: 12px; color: var(--text); }
.delta { display: inline-flex; align-items: center; gap: 2px; font: 500 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta-up { color: var(--success); }
.delta-down { color: var(--danger); }
.delta-flat, .delta-none { color: var(--text-3); }
.delta-lg { font-size: 15px; line-height: 22px; }
.age { font: 500 13px/20px var(--font-mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
.kbd {
  display: inline-flex; align-items: center; height: 20px; padding: 0 5px; border-radius: var(--r-xs);
  border: 1px solid var(--border-strong); border-bottom-width: 2px; background: var(--elevated); color: var(--text-2);
  font: 500 11px/16px var(--font-mono);
}

/* ---------------------------------------------------------------- Tabs, segmented, switch, checkbox */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; margin-bottom: -1px;
  border-bottom: 2px solid transparent; background: transparent; color: var(--text-3); font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:focus-visible { outline-offset: -2px; }
.tab-count { padding: 0 6px; border-radius: var(--r-pill); background: var(--elevated); color: var(--text-2); font: 500 11px/18px var(--font-mono); }
.tabs-sm .tab { height: 36px; font-size: 13px; padding: 0 10px; }
[role="tabpanel"]:focus-visible { outline-offset: 4px; }

.seg { display: inline-flex; align-items: center; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: var(--canvas); border: 1px solid var(--border); max-width: 100%; overflow-x: auto; }
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: var(--r-xs);
  background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.seg-md .seg-opt { height: 32px; padding: 0 12px; }
.seg-opt:hover { color: var(--text); }
.seg-opt[aria-checked="true"] { background: var(--elevated); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }

.switch-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 10px 0; }
.switch-row.is-disabled { opacity: 0.55; }
.switch-label { color: var(--text); font-weight: 500; font-size: 14px; }
.switch-hint { color: var(--text-3); font-size: 13px; line-height: 20px; margin-top: 2px; }
.switch {
  position: relative; flex: none; width: 38px; height: 22px; padding: 0; border-radius: var(--r-pill); border: 1px solid var(--border-control);
  background: var(--canvas); transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); margin-top: 1px;
}
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-2); transition: transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"] .switch-thumb { transform: translateX(16px); background: var(--on-accent); }

.check { position: relative; display: flex; }
.check input { position: absolute; opacity: 0; width: 18px; height: 18px; margin: 3px 0 0; }
.check label { display: inline-flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--text-2); font-size: 14px; line-height: 22px; }
.check-box {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-top: 2px;
  border-radius: var(--r-xs); border: 1px solid var(--border-control); background: var(--canvas); color: transparent;
}
.check input:checked + label .check-box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check input:focus-visible + label .check-box { outline: 2px solid var(--accent); outline-offset: 2px; }
.check-text { display: flex; flex-direction: column; }
.check-hint { color: var(--text-3); font-size: 13px; line-height: 20px; }
.check.is-disabled label { opacity: 0.5; cursor: not-allowed; }

/* ---------------------------------------------------------------- Inputs */
.input, .select, .textarea {
  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border-control);
  background: var(--canvas); color: var(--text); font-size: 14px; line-height: 20px;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 22px; }
.input::placeholder, .textarea::placeholder { color: var(--text-3); opacity: 1; }
.input:hover, .select:hover, .textarea:hover { border-color: #7187A0; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--danger); }
.input-sm { height: 32px; font-size: 13px; }
.select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap > .icon { position: absolute; left: 12px; color: var(--text-3); pointer-events: none; }
.input-wrap > .icon + .input { padding-left: 38px; }
.input-wrap > .input-clear { position: absolute; right: 4px; }
.input-unit { position: absolute; right: 12px; color: var(--text-3); font: 500 13px var(--font-mono); pointer-events: none; }
.input-wrap > .input.has-unit { padding-right: 40px; }
@media (max-width: 767px) { .input, .select, .textarea { font-size: 16px; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { color: var(--text); font-size: 13px; line-height: 18px; font-weight: 500; }
.field-opt { color: var(--text-3); font-weight: 400; }
.field-hint { color: var(--text-3); font-size: 12px; line-height: 16px; }
.field-error { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12px; line-height: 16px; }
.fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.fieldset legend { padding: 0; margin-bottom: 8px; color: var(--text); font-size: 13px; font-weight: 500; }

/* ---------------------------------------------------------------- Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 120; display: flex; justify-content: flex-end; align-items: stretch;
  background: rgba(3, 7, 11, 0.62); animation: fade var(--t-med) var(--ease);
}
.sheet {
  width: min(var(--sheet-w), 100%); height: 100%; display: flex; flex-direction: column; background: var(--surface);
  border-left: 1px solid var(--border-strong); box-shadow: var(--shadow-elevated); animation: slide-in var(--t-med) var(--ease);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.sheet-left { margin-right: auto; border-left: 0; border-right: 1px solid var(--border-strong); animation-name: slide-in-left; padding-right: 0; padding-left: env(safe-area-inset-left, 0px); }
.overlay:has(.sheet-left) { justify-content: flex-start; }
.sheet-bottom { width: 100%; height: auto; max-height: 88%; margin-top: auto; border-left: 0; border-top: 1px solid var(--border-strong); border-radius: var(--r-lg) var(--r-lg) 0 0; animation-name: slide-up; padding-left: env(safe-area-inset-left, 0px); }
.overlay:has(.sheet-bottom) { align-items: flex-end; }
.sheet-center { margin: auto; height: auto; max-height: min(720px, 92%); border: 1px solid var(--border-strong); border-radius: var(--r-lg); animation-name: pop; }
.overlay:has(.sheet-center) { justify-content: center; align-items: center; padding: 16px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--border); }
.sheet-title { font-size: 18px; line-height: 26px; }
.sheet-sub { color: var(--text-3); font-size: 13px; line-height: 20px; margin-top: 2px; }
.sheet-body { flex: 1 1 auto; overflow: auto; padding: 20px; min-height: 0; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
@keyframes slide-in-left { from { transform: translateX(-24px); opacity: 0; } }
@keyframes slide-up { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop { from { transform: scale(0.98); opacity: 0; } }

.pop-wrap { position: relative; display: inline-flex; }
.popover {
  position: absolute; top: calc(100% + 6px); z-index: 85; min-width: 220px; max-width: min(360px, calc(100vw - 32px));
  padding: 6px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--elevated); box-shadow: var(--shadow-menu);
  animation: fade var(--t-fast) var(--ease);
}
.popover-start { left: 0; }
.popover-end { right: 0; }
.popover-pad { padding: 12px; }
.menu { display: flex; flex-direction: column; }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--text-2); text-align: left; font-size: 14px; line-height: 20px;
}
.menu-item:hover, .menu-item:focus-visible { background: var(--hover); color: var(--text); outline: none; }
.menu-item[disabled] { opacity: 0.55; cursor: not-allowed; }
.menu-item.is-danger { color: var(--danger); }
.menu-item-text { display: flex; flex-direction: column; min-width: 0; }
.menu-item-hint { color: var(--text-3); font-size: 12px; line-height: 16px; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ---------------------------------------------------------------- Toasts */
.toaster {
  position: fixed; z-index: 150; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none;
}
body:has(.overlay) .toaster { z-index: 110; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: min(440px, calc(100vw - 32px));
  padding: 10px 8px 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--elevated);
  box-shadow: var(--shadow-elevated); color: var(--text); font-size: 14px; line-height: 20px; animation: slide-up var(--t-med) var(--ease);
}
.toast > .icon { color: var(--success); }
.toast-error > .icon { color: var(--danger); }
.toast-info > .icon { color: var(--info); }
.toast-msg { flex: 1; min-width: 0; }
.toast-action { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px 8px; border-radius: var(--r-xs); }
.toast-action:hover { background: var(--hover); }
.toast-close { display: inline-flex; border: 0; background: transparent; color: var(--text-3); padding: 6px; border-radius: var(--r-xs); }
.toast-close:hover { color: var(--text); background: var(--hover); }

/* ---------------------------------------------------------------- Panels, banners, empty states */
.panel { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
.panel-titles { min-width: 0; }
.panel-title { font-size: 16px; line-height: 24px; }
.panel-sub { color: var(--text-3); font-size: 13px; line-height: 20px; }
.panel-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.panel-body { flex: 1 1 auto; min-width: 0; padding: 0 16px 16px; }
.panel-body.is-flush { padding: 0; }
.panel-foot { border-top: 1px solid var(--border); padding: 10px 16px; color: var(--text-3); font-size: 12px; line-height: 18px; }
.banner {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid;
  font-size: 14px; line-height: 20px; color: var(--text);
}
.banner > .icon { margin-top: 1px; }
.banner-text { flex: 1 1 260px; min-width: 0; }
.banner-text strong { font-weight: 600; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner-warning { background: var(--warning-bg); border-color: var(--warning-line); }
.banner-warning > .icon { color: var(--warning); }
.banner-info { background: var(--info-bg); border-color: var(--info-line); }
.banner-info > .icon { color: var(--info); }
.banner-danger { background: var(--danger-bg); border-color: var(--danger-line); }
.banner-danger > .icon { color: var(--danger); }
.banner-neutral { background: var(--elevated); border-color: var(--border); }
.banner-neutral > .icon { color: var(--text-3); }
.empty { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty-compact { padding: 20px 12px; }
.empty-title { color: var(--text); font-weight: 600; font-size: 15px; line-height: 22px; }
.empty-body { color: var(--text-3); max-width: 46ch; }
.empty-action { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.crumbs ol { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; list-style: none; font-size: 13px; line-height: 20px; color: var(--text-3); }
.crumbs li { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.crumbs li + li::before { content: "/"; color: var(--border-strong); }
.crumbs a { color: var(--text-3); text-decoration: none; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumbs [aria-current] { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }

.page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.page-head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
.page-head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 360px; }
.page-title { font-size: 24px; line-height: 32px; }
.page-title:focus { outline: none; }
.page-sub { color: var(--text-3); }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--text-3); font-size: 13px; line-height: 20px; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 767px) { .page-title { font-size: 22px; line-height: 30px; } }

.skeleton { display: block; background: linear-gradient(90deg, var(--elevated), var(--hover), var(--elevated)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-xs); }
@keyframes shimmer { to { background-position: -200% 0; } }

.kv { display: flex; flex-direction: column; margin: 0; }
.kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.kv-row:last-child { border-bottom: 0; }
.kv dt { color: var(--text-3); font-size: 13px; line-height: 20px; display: inline-flex; align-items: center; }
.kv dd { margin: 0; color: var(--text); font-size: 13px; line-height: 20px; text-align: right; min-width: 0; }

/* ---------------------------------------------------------------- Tables */
.table-scroll { position: relative; width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 20px; }
.table th {
  height: 36px; padding: 0 12px; text-align: left; white-space: nowrap; vertical-align: middle;
  color: var(--text-3); font-size: 12px; line-height: 16px; font-weight: 500; border-bottom: 1px solid var(--border); background: var(--surface);
}
.table td { height: var(--row); padding: 4px 12px; border-bottom: 1px solid var(--grid); vertical-align: middle; color: var(--text-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font: 500 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.table th.num { font-family: var(--font-sans); font-weight: 500; font-size: 12px; color: var(--text-3); }
.table tbody tr { transition: background-color var(--t-fast) var(--ease); }
.table tbody tr:hover td { background: rgba(35, 50, 66, 0.55); }
.table tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.table tbody tr:focus-visible td { background: rgba(35, 50, 66, 0.55); }
.table-compact td { height: 34px; }
.table-caption { caption-side: top; text-align: left; padding: 0 0 8px; color: var(--text-3); font-size: 12px; line-height: 18px; }
.th-sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; white-space: nowrap; }
.th-sort:hover { color: var(--text); }
.th-sort .icon { opacity: 0.55; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--text); }
th[aria-sort="ascending"] .th-sort .icon, th[aria-sort="descending"] .th-sort .icon { opacity: 1; color: var(--accent); }
.num .th-sort { flex-direction: row-reverse; }
.tick-flash { animation: tickflash 0.9s var(--ease); border-radius: 3px; }
@keyframes tickflash { 0%, 35% { background: var(--tick-flash); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .tick-flash { animation: none; } }

/* ---------------------------------------------------------------- Charts */
.chart { margin: 0; position: relative; min-width: 0; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; color: var(--text-2); font-size: 12px; line-height: 16px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.chart-stage { position: relative; width: 100%; border-radius: var(--r-sm); touch-action: pan-y; }
.chart-stage:focus-visible { outline-offset: 4px; }
.chart-svg { overflow: visible; }
.chart-grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart-zero { stroke: var(--border-strong); }
.chart-axis { stroke: var(--border); stroke-width: 1; shape-rendering: crispEdges; }
.chart-tick { fill: var(--text-3); font: 500 11px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.chart-endlabel { fill: var(--text); font: 600 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.chart-leader { stroke: var(--text-3); stroke-width: 1; }
.chart-gap { fill: rgba(144, 162, 181, 0.07); }
.chart-gap-label { fill: var(--text-3); font: 500 10px/1 var(--font-sans); }
.chart-marker line { stroke: rgba(177, 192, 207, 0.26); stroke-width: 1; }
.chart-marker circle { fill: var(--chart-surface); stroke: var(--text-3); stroke-width: 1.25; }
.chart-marker text { fill: var(--text-2); font: 600 10px/1 var(--font-mono); }
.chart-marker.is-active line { stroke: var(--accent); }
.chart-marker.is-active circle { stroke: var(--accent); }
.chart-cross line { stroke: var(--text-3); stroke-width: 1; }
.chart-tip {
  position: absolute; top: 8px; z-index: 6; min-width: 190px; max-width: 270px; padding: 8px 10px; pointer-events: none;
  border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--elevated); box-shadow: var(--shadow-menu);
  font-size: 12px; line-height: 18px;
}
.chart-tip.is-flipped { transform: translateX(-100%); }
.chart-tip-time { color: var(--text-3); font-size: 11px; margin-bottom: 4px; }
.chart-tip-row { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); align-items: center; gap: 6px; }
.chart-tip-row strong { color: var(--text); font: 600 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; }
.chart-tip-row span { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-tip-meta { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 11px; line-height: 16px; }
.chart-tip-event { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; color: var(--text); }
.chart-tip-pin { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font: 600 10px/1 var(--font-mono); margin-top: 1px; }
.chart-table-wrap { max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: var(--r-sm); }
.chart-table-wrap .table th { position: sticky; top: 0; z-index: 1; }
.chart-table-wrap .table-caption { padding: 10px 12px; background: var(--surface); }
.chart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.chart-toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; color: var(--text-3); font-size: 12px; line-height: 18px; }
.chart-foot .icon { display: inline; vertical-align: -3px; margin-right: 4px; }
.spark { display: inline-block; vertical-align: middle; }

/* ---------------------------------------------------------------- Order book ladder */
.ladder { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.ladder th { color: var(--text-3); font-size: 12px; font-weight: 500; text-align: left; padding: 0 8px 6px; }
.ladder th.num { text-align: right; }
.ladder td { padding: 3px 8px; }
.ladder .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
.ladder-price { width: 64px; }
.ladder-bar-cell { width: 100%; }
.ladder-bar { display: block; height: 10px; border-radius: 2px; }
.ladder-ask .ladder-bar { background: rgba(197, 138, 249, 0.38); margin-left: auto; }
.ladder-bid .ladder-bar { background: rgba(90, 199, 235, 0.38); }
.ladder-label th { padding-top: 8px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.ladder-spread td { text-align: center; color: var(--text-3); font: 500 12px/18px var(--font-mono); padding: 6px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

/* ---------------------------------------------------------------- Marketing shell */
.mkt { min-height: 100%; display: flex; flex-direction: column; }
.mkt main { flex: 1 0 auto; }
.container { width: 100%; max-width: 1248px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
@media (min-width: 768px) {
  .container { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
}
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; flex: none; border-radius: var(--r-sm); }
.logo:hover { color: var(--text); }
.logo-word { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }

.mkt-nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--mkt-nav);
  border-bottom: 1px solid transparent; background: transparent;
  transition: background-color var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
}
.mkt-nav.is-solid { background: var(--canvas); border-bottom-color: var(--border); }
.mkt-nav-inner { display: flex; align-items: center; gap: 20px; height: 100%; }
.mkt-links { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
.mkt-links > ul { display: flex; align-items: center; gap: 2px; list-style: none; }
.nav-link {
  display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 12px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
}
.nav-link:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.nav-link[aria-expanded="true"] { color: var(--text); background: var(--elevated); }
.nav-link[aria-current="page"] { color: var(--text); }
.nav-caret { transition: transform var(--t-fast) var(--ease); }
.nav-link[aria-expanded="true"] .nav-caret { transform: rotate(180deg); }
.nav-dd { position: relative; }
.nav-panel {
  position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 60; width: 340px;
  padding: 8px; border-radius: var(--r-lg); border: 1px solid var(--border-strong); background: var(--elevated); box-shadow: var(--shadow-elevated);
  animation: fade var(--t-med) var(--ease);
}
.nav-panel.is-wide { width: 580px; }
.nav-panel ul { list-style: none; display: grid; gap: 2px; }
.nav-panel.is-wide ul { grid-template-columns: 1fr 1fr; }
.nav-item { display: flex; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); color: var(--text-2); text-decoration: none; }
.nav-item:hover { background: var(--hover); color: var(--text-2); }
.nav-item-icon { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--accent-subtle); color: var(--accent); }
.nav-item-label { display: block; color: var(--text); font-size: 14px; line-height: 20px; font-weight: 600; }
.nav-item-desc { display: block; color: var(--text-3); font-size: 13px; line-height: 18px; }
.mkt-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.mkt-menu-btn { display: none; }
.nav-lg-only { display: none; }
@media (max-width: 1199px) {
  .nav-xl { display: none; }
  .nav-lg-only { display: block; }
}
@media (max-width: 1023px) {
  .mkt-links { display: none; }
  .mkt-menu-btn { display: inline-flex; }
}
@media (max-width: 639px) {
  .nav-login { display: none; }
  .nav-cta { height: 36px; padding: 0 12px; font-size: 13px; }
}
.drawer-nav { display: flex; flex-direction: column; }
.drawer-link { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 4px; color: var(--text); text-decoration: none; font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--grid); }
.drawer-link:hover { color: var(--accent-hover); }
.drawer-sub { color: var(--text-2); font-size: 15px; }
.drawer-sub .icon { color: var(--text-3); }
.drawer-group { margin-top: 20px; padding-bottom: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.drawer-ctas { display: grid; gap: 8px; margin-top: 24px; }

/* ---------------------------------------------------------------- Type */
.mkt-h1 { font-size: 64px; line-height: 72px; letter-spacing: -0.02em; font-weight: 600; }
.mkt-h1 > span { display: block; }
.mkt-h1:focus { outline: none; }
.mkt-h2 { font-size: 42px; line-height: 50px; letter-spacing: -0.015em; }
.mkt-h3 { font-size: 26px; line-height: 34px; letter-spacing: -0.01em; }
.mkt-h3-sm { font-size: 20px; line-height: 28px; }
@media (max-width: 767px) {
  .mkt-h1 { font-size: 38px; line-height: 46px; }
  .mkt-h1 > span { display: inline; }
  .mkt-h2 { font-size: 30px; line-height: 38px; }
  .mkt-h3 { font-size: 22px; line-height: 30px; }
}

/* ---------------------------------------------------------------- Hero */
.hero { position: relative; overflow: hidden; padding-block: 56px 96px; margin-top: calc(var(--mkt-nav) * -1); padding-top: calc(var(--mkt-nav) + 64px); }
.hero-glow {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 48% 58% at 74% 46%, rgba(70, 200, 229, 0.13), transparent 70%),
    radial-gradient(ellipse 34% 40% at 92% 78%, rgba(145, 185, 255, 0.06), transparent 70%);
}
.hero-grid { position: relative; display: grid; gap: 48px; }
.hero-copy { max-width: 680px; display: flex; flex-direction: column; }
.hero-copy .eyebrow { margin-bottom: 20px; }
.hero-sub { margin-top: 24px; font-size: 18px; line-height: 28px; color: var(--text-2); max-width: 36em; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero-foot { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: var(--text-3); font-size: 13px; line-height: 20px; }
.hero-foot .icon { color: var(--success); }
.hero-visual { min-width: 0; position: relative; }
@media (min-width: 1200px) {
  .hero-grid { grid-template-columns: minmax(0, 700px) minmax(0, 1fr); align-items: center; gap: 48px; }
  .hero-visual .preview { width: 860px; -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent 100%); mask-image: linear-gradient(90deg, #000 72%, transparent 100%); }
}
@media (min-width: 1200px) and (max-width: 1279px) {
  .hero .mkt-h1 { font-size: 58px; line-height: 66px; }
}
@media (max-width: 767px) {
  .hero { padding-top: calc(var(--mkt-nav) + 32px); padding-bottom: 56px; }
  .hero-grid { gap: 32px; }
  .hero-sub { font-size: 16px; line-height: 26px; margin-top: 16px; }
  .hero-ctas { margin-top: 24px; }
  .hero-ctas .btn { flex: 1 1 100%; }
}

/* Terminal preview (live data) */
.pv-window { border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--canvas); overflow: hidden; box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45); }
.pv-bar { display: flex; align-items: center; gap: 16px; height: 40px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--sidebar); font-size: 12px; }
.pv-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
.pv-tabs { display: inline-flex; gap: 4px; }
.pv-tabs span { padding: 3px 10px; border-radius: var(--r-sm); color: var(--text-3); white-space: nowrap; }
.pv-tabs .is-active { background: var(--elevated); color: var(--text); }
.pv-watermark {
  margin-left: auto; flex: none; padding: 1px 6px; border-radius: var(--r-xs); border: 1px dashed var(--border-strong);
  color: var(--text-3); font: 600 10px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.pv-body { display: grid; grid-template-columns: 46px minmax(0, 1fr) 250px; gap: 12px; padding: 12px 12px 12px 0; }
.pv-rail { display: flex; flex-direction: column; align-items: center; gap: 6px; border-right: 1px solid var(--border); padding-top: 2px; }
.pv-rail-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: var(--r-sm); color: var(--text-3); }
.pv-rail-icon.is-active { color: var(--accent); background: var(--accent-bg); }
.pv-main { min-width: 0; }

.compare-plans:focus-visible { outline-offset: 2px; }
.plan-table { min-width: 760px; }
.plan-table th, .plan-table td { height: 46px; font-size: 14px; }
.plan-table thead th { color: var(--text); font-size: 14px; font-weight: 600; height: 52px; }
.plan-table tbody th { color: var(--text-2); font-weight: 400; text-align: left; border-bottom: 1px solid var(--grid); background: var(--surface); }
.plan-table td { color: var(--text-2); }
.plan-table .plan-group th { color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; height: 40px; padding-top: 12px; background: var(--surface); }
.sticky-col { position: sticky; left: 0; z-index: 1; }
.plan-table .sticky-col { min-width: 260px; }
.info-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 64px; }

.info-cols p { color: var(--text-2); font-size: 15px; line-height: 24px; }
@media (max-width: 1023px) { .info-cols { grid-template-columns: 1fr; gap: 24px; } }

/* Methodology */
.method { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 56px; align-items: start; }
.method-toc { position: sticky; top: calc(var(--mkt-nav) + 24px + env(safe-area-inset-top, 0px)); }
.method-toc ul { list-style: none; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--border); }
.method-toc a { display: block; padding: 6px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--text-3); text-decoration: none; font-size: 13px; line-height: 20px; }
.method-toc a:hover { color: var(--text); }
.method-toc a[aria-current] { color: var(--text); border-left-color: var(--accent); }
.method-toc-title { margin-bottom: 10px; }
.method-select { display: none; }
@media (max-width: 1023px) {
  .method { grid-template-columns: 1fr; gap: 24px; }
  .method-toc { position: sticky; top: calc(var(--mkt-nav) + 8px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--canvas); padding-block: 8px; }
  .method-toc ul, .method-toc-title { display: none; }
  .method-select { display: block; }
}
.prose { max-width: 760px; min-width: 0; }
.prose section { padding-top: 40px; scroll-margin-top: calc(var(--mkt-nav) + 24px); }
.prose section:focus { outline: none; }
.prose h2 { font-size: 24px; line-height: 32px; margin-bottom: 12px; }
.prose p { color: var(--text-2); font-size: 15px; line-height: 26px; margin-bottom: 14px; max-width: 70ch; }
.prose strong { color: var(--text); font-weight: 600; }
.prose .table-scroll { margin: 8px 0 16px; border: 1px solid var(--border); border-radius: var(--r-md); }
.prose .table-caption { padding: 10px 12px 0; }
.callout { display: flex; gap: 12px; padding: 16px; border-radius: var(--r-md); border: 1px solid var(--warning-line); background: var(--warning-bg); color: var(--text); }
.callout > .icon { color: var(--warning); margin-top: 2px; }
.callout ul { margin-top: 8px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--text-2); font-size: 15px; line-height: 24px; }
.entity-chain { list-style: none; display: flex; flex-direction: column; margin: 8px 0 16px; border-left: 1px solid var(--border-strong); }
.entity-chain li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px 0 10px 16px; position: relative; font-size: 15px; line-height: 24px; color: var(--text-2); }
.entity-chain li::before { content: ""; position: absolute; left: -4px; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.entity-k { color: var(--text); font-weight: 600; }
.defs { display: flex; flex-direction: column; margin: 0 0 12px; border-top: 1px solid var(--border); }
.defs > div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.defs dt { color: var(--text); font-weight: 600; font-size: 15px; line-height: 24px; }
.defs dd { margin: 0; color: var(--text-2); font-size: 15px; line-height: 24px; }
.formula { display: block; margin-top: 8px; width: fit-content; max-width: 100%; overflow-x: auto; padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; white-space: nowrap; }
.formula-block { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); }
.formula-block code { color: var(--text); font-size: 13px; overflow-x: auto; white-space: nowrap; }
.formula-block span { color: var(--text-3); font-size: 14px; line-height: 22px; }
.status-legend { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 8px 0 16px; }
.status-legend li { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: start; color: var(--text-2); font-size: 15px; line-height: 24px; }
.status-legend .badge { justify-self: start; margin-top: 1px; }
.changelog { list-style: none; }
.changelog li { display: grid; grid-template-columns: 56px 120px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); color: var(--text-2); font-size: 14px; }
@media (max-width: 767px) {
  .defs > div, .status-legend li { grid-template-columns: 1fr; gap: 6px; }
  .entity-chain li { grid-template-columns: 1fr; gap: 2px; }
  .changelog li { grid-template-columns: 48px minmax(0, 1fr); }
  .changelog li span:last-child { grid-column: 1 / -1; }
}

/* Auth */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); }
.auth-brand { display: none; }
@media (min-width: 1024px) {
  .auth { grid-template-columns: minmax(380px, 0.9fr) minmax(0, 1.1fr); }
  .auth-brand { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px 48px max(48px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--border); background: radial-gradient(ellipse 80% 60% at 20% 30%, rgba(70, 200, 229, 0.10), transparent 70%), var(--sidebar); overflow: hidden; }
  .auth-top .logo { visibility: hidden; }
}
.auth-brand-body { display: flex; flex-direction: column; gap: 28px; position: relative; z-index: 1; }
.auth-quote { color: var(--text); font-size: 34px; line-height: 42px; font-weight: 600; letter-spacing: -0.015em; max-width: 12em; }
.auth-points { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.auth-points li { display: flex; gap: 12px; align-items: center; color: var(--text-2); font-size: 15px; }
.auth-points .icon { color: var(--accent); }
.auth-line { position: absolute; left: 0; right: 0; top: 34%; width: 100%; height: 120px; opacity: 0.45; }
.auth-main { display: flex; flex-direction: column; align-items: center; padding: 24px var(--gutter-r) 48px var(--gutter-l); }
.auth-top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.muted-link { color: var(--text-3); }
.auth-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; margin-block: auto; padding: 28px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); }
.auth-title { font-size: 24px; line-height: 32px; }
.auth-title:focus { outline: none; }
.auth-form { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
.auth-or { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; }
.auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.pw-input { padding-right: 64px; }
.pw-toggle { position: absolute; right: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; }
.pw-toggle:hover { background: var(--elevated); }
.pw-rules { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: -8px; }
.pw-rules li { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
.pw-rules li.is-ok { color: var(--success); }
.auth-consents { gap: 10px; }
.auth-terms-err { margin: 4px 0 0 28px; }
.auth-switch { text-align: center; color: var(--text-3); font-size: 14px; }
.auth-sent { margin-top: 18px; }
.auth-demo { display: flex; gap: 6px; align-items: flex-start; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; line-height: 18px; }
.auth-demo .icon { margin-top: 2px; flex: none; }
@media (max-width: 479px) { .auth-card { padding: 20px 16px; } }

/* Onboarding */
.onb { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(70, 200, 229, 0.07), transparent 70%), var(--canvas); }
.onb-top { display: flex; justify-content: space-between; align-items: center; padding: 20px var(--gutter-r) 20px var(--gutter-l); }
.onb-main { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px var(--gutter-r) 64px var(--gutter-l); display: flex; flex-direction: column; gap: 16px; }
.onb-steps { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.onb-steps li { padding-top: 10px; border-top: 3px solid var(--border); color: var(--text-3); font-size: 13px; line-height: 18px; }
.onb-steps li.is-done { border-top-color: var(--accent-line); color: var(--text-2); }
.onb-steps li.is-current { border-top-color: var(--accent); color: var(--text); font-weight: 500; }
.onb-title { font-size: 32px; line-height: 40px; margin-top: 12px; letter-spacing: -0.01em; }
.onb-title:focus { outline: none; }
.onb-legend { color: var(--text); font-size: 16px !important; font-weight: 600 !important; margin-bottom: 12px !important; }
.choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; text-align: left; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); }
.choice:hover { border-color: var(--border-control); background: var(--elevated); }
.choice .icon { color: var(--text-3); }
.choice.is-on { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.is-on .icon { color: var(--accent); }
.choice-sm { flex-direction: row; align-items: center; padding: 12px 14px; }
.choice-label { color: var(--text); font-size: 15px; font-weight: 600; }
.choice-desc { color: var(--text-3); font-size: 13px; line-height: 20px; }
.chip-btn { cursor: pointer; }
.chip-btn:hover { border-color: var(--border-control); color: var(--text); }
.onb-panel { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.onb-panel .switch-row + .switch-row { border-top: 1px solid var(--grid); }
.onb-note { display: flex; gap: 6px; align-items: flex-start; padding: 10px 0 12px; border-top: 1px solid var(--grid); }
.onb-note .icon { margin-top: 3px; flex: none; }
.onb-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.onb-hint { text-align: right; }
@media (max-width: 639px) { .choice-grid { grid-template-columns: 1fr; } .onb-title { font-size: 26px; line-height: 34px; } }

/* Stub pages */
.stub { min-height: 60vh; }
.stub-card { width: 100%; max-width: 720px; margin-top: 12px; padding: 20px; border-radius: var(--r-lg); border: 1px dashed var(--border-strong); background: var(--surface); }
.stub-flag { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--text); font-size: 14px; font-weight: 500; }
.stub-flag .icon { color: var(--accent); }
.stub-list { margin-top: 8px; padding-left: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; color: var(--text-2); font-size: 14px; line-height: 22px; }
@media (max-width: 639px) { .stub-list { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------- Terminal shell */
.term { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; background: var(--canvas); }
.term-expanded { grid-template-columns: var(--rail) minmax(0, 1fr); }
.term-rail { grid-template-columns: var(--rail-collapsed) minmax(0, 1fr); }
.term-col { min-width: 0; display: flex; flex-direction: column; }
.term-main { flex: 1 0 auto; min-width: 0; padding: 20px 24px 32px; }
.term-drawer .term-main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.term-mobile .term-main { padding: 16px var(--gutter-r) calc(88px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.term-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 12px 24px 16px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; line-height: 18px; }
.term-foot a { color: var(--text-3); }
.term-mobile .term-foot { padding: 12px var(--gutter-r) calc(84px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.term-mobile .term-main { padding-bottom: 24px; }

/* Sidebar */
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; overflow-x: hidden; background: var(--sidebar);
  border-right: 1px solid var(--border); padding-left: env(safe-area-inset-left, 0px); scrollbar-width: thin;
}
.side-inner { display: flex; flex-direction: column; gap: 6px; min-height: 100%; padding: 14px 12px 12px; }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; margin-bottom: 8px; padding-left: 4px; }
.side-search {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; margin-bottom: 8px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--canvas); color: var(--text-3); font-size: 13px; text-align: left;
}
.side-search:hover { border-color: var(--border-control); color: var(--text-2); }
.side-kbd { margin-left: auto; }
.side-nav { display: flex; flex-direction: column; gap: 10px; }
.side-nav ul, .side-foot ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.side-link {
  position: relative; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: var(--r-sm);
  color: var(--text-2); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.side-link:hover { color: var(--text); background: var(--elevated); }
.side-link.is-active { color: var(--text); background: rgba(70, 200, 229, 0.08); }
.side-link.is-active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.side-link.is-active .icon { color: var(--accent); }
.side-label { overflow: hidden; text-overflow: ellipsis; }
.side-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 600 11px/18px var(--font-mono); text-align: center; }
.side-group { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--border); }
.side-group-btn { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 10px; border: 0; background: transparent; color: var(--text-3); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: var(--r-xs); }
.side-group-btn:hover { color: var(--text); }
.side-group-btn[aria-expanded="false"] .icon { transform: rotate(-90deg); }
.side-sep { height: 1px; }
.side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.side-profile { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); }
.side-profile-text { display: flex; flex-direction: column; line-height: 18px; min-width: 0; }
.avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-subtle); color: var(--accent); font: 600 11px/1 var(--font-mono); border: 1px solid var(--accent-line); }
.side-inner.is-collapsed { padding: 14px 10px 12px; align-items: stretch; }
.is-collapsed .side-top { justify-content: center; padding-left: 0; }
.is-collapsed .side-label, .is-collapsed .side-group-btn { display: none; }
.is-collapsed .side-search { justify-content: center; padding: 0; }
.is-collapsed .side-link { justify-content: center; padding: 0; }
.is-collapsed .side-link.is-active::before { left: -10px; }
.is-collapsed .side-badge { position: absolute; top: 2px; right: 4px; min-width: 16px; height: 16px; font-size: 10px; line-height: 16px; padding: 0 4px; }
.is-collapsed .side-profile { justify-content: center; padding: 6px 0; }
.side-expand { align-self: center; }
.nav-sheet .sheet-body { padding: 0; }
.nav-sheet .sheet-head { display: none; }
.nav-sheet .side-inner { min-height: 100%; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 12px; height: var(--topbar);
  padding: 0 24px; background: var(--canvas); border-bottom: 1px solid var(--border);
}
.term-drawer .topbar, .term-mobile .topbar { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px; }
.topbar-logo { display: inline-flex; border-radius: var(--r-sm); }
.topbar-crumbs { flex: 1 1 auto; min-width: 0; }
.topbar-crumbs .crumbs ol { flex-wrap: nowrap; overflow: hidden; }
.topbar-crumbs .crumbs li { flex: none; }
.topbar-crumbs .crumbs li:last-child { flex: 0 1 auto; min-width: 0; }
.topbar-crumbs .crumbs li:last-child span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-crumbs .crumbs [aria-current] { color: var(--text); font-weight: 500; }
.topbar-search {
  display: flex; align-items: center; gap: 10px; width: 300px; height: 36px; padding: 0 8px 0 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-3); font-size: 13px; flex: none;
}
.topbar-search:hover { border-color: var(--border-control); color: var(--text-2); }
.topbar-search-text { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 6px; flex: none; }
.plan-badge { display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: var(--r-xs); border: 1px solid var(--warning-line); color: var(--warning); font-size: 12px; font-weight: 600; white-space: nowrap; }
.feed-pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.feed-pill:hover, .feed-pill[aria-expanded="true"] { background: var(--elevated); color: var(--text); }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }
.feed-pill.is-warn { border-color: var(--warning-line); color: var(--warning); }
.feed-pill.is-warn .feed-dot { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-bg); }
.feed-time { color: var(--text-3); font-size: 12px; }
.feed-pop { display: flex; flex-direction: column; gap: 8px; }
.feed-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 4px 0; }
.feed-list li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.alerts-pop { display: flex; flex-direction: column; gap: 10px; }
.alert-mini { list-style: none; display: flex; flex-direction: column; }
.alert-mini li { display: flex; flex-direction: column; gap: 2px; padding: 8px 0 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 19px; color: var(--text-2); position: relative; }
.alert-mini li.is-unread::before { content: ""; position: absolute; left: 0; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
@media (max-width: 1279px) { .topbar-search { width: 220px; } .feed-time { display: none; } }
@media (max-width: 1023px) {
  .topbar-search { width: 40px; height: 40px; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
  .topbar-search .topbar-search-text, .topbar-search .kbd { display: none; }
  .plan-badge { display: none; }
}
@media (max-width: 767px) {
  .topbar-crumbs { visibility: hidden; }
  .feed-text { display: none; }
  .feed-pill { padding: 0 9px; }
  .hide-mobile { display: none; }
}

/* Mobile tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  height: calc(60px + env(safe-area-inset-bottom, 0px)); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: rgba(14, 21, 29, 0.97); border-top: 1px solid var(--border); backdrop-filter: blur(8px);
}
.tabbar-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 44px; border: 0; background: transparent; color: var(--text-3); font-size: 11px; line-height: 14px; font-weight: 500; text-decoration: none; }
